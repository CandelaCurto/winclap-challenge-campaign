name: Campaign pipeline

on:
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push: # when a new CSV is uploaded, publish right away instead of waiting for Monday
    branches: [main]
    paths: ["data/**"]
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC = 9:00 in Argentina

permissions:
  contents: read

# One run at a time: if the manual and the weekly run overlap, the second one waits for the first
# to finish instead of writing the Sheet at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04 # pinned: a system change does not arrive unannounced
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"] # the minimum supported version and the newest one
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Formatting
        run: black --check .

      # If any rule stopped holding, the run stops here and the Sheet is not touched.
      - name: Tests
        run: python -m pytest

  publish:
    needs: test # only publishes if the tests passed on every version
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # today it takes less than a minute; if something hangs, it does not run 6 hours
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version # the minimum supported version, same as local
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Clean, compute and publish to Google Sheets
        run: python src/pipeline.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }} # results Sheet
          REVIEW_SPREADSHEET_ID: ${{ vars.REVIEW_SPREADSHEET_ID }} # review Sheet: discarded and corrected rows

      # The generated tables and the discarded rows with their reason, attached to the run.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-output
          path: output/
